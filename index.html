
<!DOCTYPE html>

 <head>
    <meta charset="UTF-8" />

    <title>TestCrack</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Marketing site type: Manrope / IBM Plex Sans / JetBrains Mono.

      Noto Sans Malayalam backs the landing page's Malayalam mode — none of the
      three Latin families above ship Malayalam glyphs, so without it the script
      falls back to whatever the device happens to have installed (and to tofu
      boxes where it has nothing). It is listed last in every Tailwind font
      stack, so it only ever renders characters the Latin faces cannot.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap"
    />

    <meta property="og:title" content="TestCrack" />
    <meta property="og:description" content="AI-powered learning platform to help students learn effectively and faster" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/favicon.svg" />
</head>
